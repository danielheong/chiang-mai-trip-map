# Free Supabase projects pause after about a week without activity, which would stop sync.
# This makes one tiny read every 3 days so the project stays awake. It reads nothing real:
# the trip code below doesn't exist. Run it by hand from the Actions tab any time.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the sync database
        run: |
          curl -fsS -X POST "https://nxoimohwoceipazoggvj.supabase.co/rest/v1/rpc/trip_get" \
            -H "apikey: sb_publishable_6CWz_9RyA_gmMZd4Ccquzw_Zd_0pGj8" \
            -H "Content-Type: application/json" \
            -d '{"p_trip":"KEEPAWAKEPING0000000"}'
          echo
          echo "Supabase answered, so it stays awake."
