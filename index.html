<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chiang Mai Trip Map</title>
  <meta name="description" content="Pin where you'll sleep, eat and wander in Chiang Mai.">
  <meta name="theme-color" content="#EAF2EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121A1F" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 31C12 22 5 18 5 11a11 11 0 1 1 22 0c0 7-7 11-11 20z' fill='%23F2A21E' stroke='%2322302A' stroke-width='2'/%3E%3Ccircle cx='16' cy='11' r='4' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Chiang Mai Trip Map</h1>
      <p>Pin where you'll sleep, eat, wander and wai.</p>
    </div>
    <div class="top-actions">
      <button class="btn ghost" id="syncBtn" type="button" title="Keep pins the same on all your devices">Sync</button>
      <button class="btn ghost" id="exportBtn" type="button" title="Save your pins to a file">Export</button>
      <label class="btn ghost" for="importFile" title="Load pins from a file">Import</label>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="btn primary" id="addBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        Add a place
      </button>
    </div>
  </header>

  <main class="app">
    <section class="card mapwrap" aria-label="Map of Chiang Mai">
      <div id="map"></div>
      <div class="ovl tl">
        <div class="search" id="search">
          <div class="sbox">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M15.5 15.5 20 20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
            <input id="q" type="text" placeholder="Search places, your pins or #tags" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="sres" aria-autocomplete="list">
            <button type="button" class="x" id="qclear" aria-label="Clear search" hidden>×</button>
          </div>
          <div class="sres" id="sres" role="listbox" hidden></div>
        </div>
        <button class="pill" id="ideasBtn" type="button" aria-pressed="true">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"/></svg>
          Ideas
        </button>
      </div>
      <div class="ovl banner" id="banner" hidden><span id="bannerText">Tap the map where it is</span><button type="button" id="bannerCancel">Cancel</button></div>
      <div class="ovl fitbtn"><button type="button" id="zfit" aria-label="Show all pins" title="Show all pins">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button></div>
    </section>

    <aside class="card panel" aria-label="Your places">
      <div class="phead" id="phead"></div>
      <div class="pbody" id="pbody"></div>
      <button type="button" class="pfoot" id="pfoot"><b></b><span id="syncTxt">Saved on this device only</span></button>
    </aside>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
